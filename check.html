<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report · Stock</title>
<link rel="stylesheet" href="apple-ui/apple-ui.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Stock">
<script src="js/theme.js"></script>
</head>
<body>

<div class="page wait">
  <div class="topbar">
    <a class="icon-btn" aria-label="Back" href="today.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
  </div>

  <h1 class="title" id="title">Report</h1>
  <p class="sub" id="sub"></p>

  <div class="seg" id="views" hidden></div>

  <div class="stats" id="stats" style="margin-top:22px" hidden></div>
  <div id="body"></div>

  <div id="dl" hidden>
    <button class="btn" data-press id="share">Share</button>
    <button class="btn frost" data-press id="download">Download PDF</button>
    <p class="error-text" id="err" hidden></p>
  </div>
</div>

<script src="js/shell.js" data-tab="today"></script>
<script src="apple-ui/apple-ui.js"></script>
<script type="module">
  import { start, db, $, esc, fmtNum, toOrder, blockOf, blockLabel, BLOCK_NAME, param, niceDate, refreshUI } from './js/app.js';
  import { blockData, festNote } from './js/check.js';
  import { makePdf, shareOrDownload } from './js/pdf.js';
  import { doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

  const { isAdmin } = await start({ tab: 'today' });
  const start0 = param('block');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start0 || '')) { location.replace('today.html'); await new Promise(() => {}); }
  const block = blockOf(start0);
  let v = param('v') || 'report';
  if (!isAdmin && v !== 'inputs') v = 'inputs';

  const { check, lines, fest } = await blockData(block);
  const done = check?.status === 'submitted';
  const amt = (n, unit) => `${fmtNum(n)}<span class="unit">${esc(unit)}</span>`;
  const label = `${BLOCK_NAME[block.type]} block · ${blockLabel(block)}`;
  let pdfSpec = null;
  let seen = Promise.resolve();   // saving "report seen" before leaving the page

  // views the admin can switch between for this block
  const views = done
    ? [['inputs', 'Inputs'], ['report', 'Order'], ...(check.invoice ? [['missing', 'Missing']] : [])]
    : [['list', 'List'], ['inputs', 'Inputs']];
  if (!views.some(([k]) => k === v)) v = views[0][0];
  if (isAdmin && views.length > 1) {
    $('#views').hidden = false;
    $('#views').innerHTML = views.map(([k, t]) => `<button data-v="${k}" class="${k === v ? 'on' : ''}">${t}</button>`).join('');
    $('#views').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      v = b.dataset.v; history.replaceState(null, '', `check.html?block=${block.start}&v=${v}`); draw();
    });
  }

  function stats(pairs) {
    $('#stats').hidden = !pairs;
    if (pairs) $('#stats').innerHTML = pairs.map(([n, k]) => `<div class="stat" data-sq="22"><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');
  }

  function draw() {
    document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('#dl').hidden = true; pdfSpec = null; stats(null);
    const note = fest.length ? ` · ${festNote(fest)}` : '';
    const by = done ? `Checked by ${check.checkedBy || '?'}` : 'Not submitted yet';

    if (v === 'list') {
      $('#title').textContent = 'Block list';
      $('#sub').textContent = `${label}${note}. How much should be in the store for these days.`;
      $('#body').innerHTML = `<div class="lbl">${lines.length} items</div><div class="group plain" data-sq="22">${
        lines.map(l => `<div class="row"><div class="label">${esc(l.name)}</div><div class="amt">${amt(l.need, l.unit)}</div></div>`).join('')
        || '<div class="empty">No items yet.</div>'}</div>`;
    }

    if (v === 'inputs') {
      $('#title').textContent = 'Inputs';
      $('#sub').textContent = `${label}. ${by}.`;
      const counted = lines.filter(l => l.counted != null);
      $('#body').innerHTML = `<div class="lbl">Counted in the store</div><div class="group plain" data-sq="22">${
        lines.map(l => `<div class="row"><div class="label">${esc(l.name)}${isAdmin ? `<small>Needs ${fmtNum(l.need)} ${esc(l.unit)}</small>` : ''}</div>
          ${l.counted != null ? `<div class="amt">${amt(l.counted, l.unit)}</div>` : '<div class="todo">Not counted</div>'}</div>`).join('')
        || '<div class="empty">Nothing counted yet.</div>'}</div>`;
      pdfSpec = { name: 'Stock count', sections: [{ heading: 'Counted in the store',
        cols: ['Item', 'Counted', 'Needs'], right: [1, 2],
        rows: counted.map(l => [l.name, `${fmtNum(l.counted)} ${l.unit}`, `${fmtNum(l.need)} ${l.unit}`]) }] };
    }

    if (v === 'report') {
      $('#title').textContent = 'Order report';
      $('#sub').textContent = `${label}${note}. ${by}.`;
      const buy = lines.filter(l => l.buy > 0), ok = lines.filter(l => !(l.buy > 0));
      stats([[buy.length, 'To buy'], [ok.length, 'Enough'], [lines.length, 'Items']]);
      $('#body').innerHTML = `
        <div class="lbl">To buy</div><div class="group plain" data-sq="22">${buy.map(l => `
          <div class="row"><div class="label">${esc(l.name)}<small>Have ${fmtNum(l.counted)} · need ${fmtNum(l.need)} ${esc(l.unit)}</small></div>
          <div class="amt">${amt(l.buy, l.unit)}</div></div>`).join('') || '<div class="empty">Nothing to buy. Everything is stocked.</div>'}</div>
        <div class="lbl">Enough in the store</div><div class="group plain" data-sq="22">${ok.map(l => `
          <div class="row"><div class="label">${esc(l.name)}<small>Have ${fmtNum(l.counted)} · need ${fmtNum(l.need)} ${esc(l.unit)}</small></div>
          <div class="val">OK</div></div>`).join('') || '<div class="empty">None.</div>'}</div>`;
      pdfSpec = { name: 'Order', sections: [
        { heading: 'To buy', cols: ['Item', 'Buy', 'Have', 'Need'], right: [1, 2, 3],
          rows: buy.map(l => [l.name, `${fmtNum(l.buy)} ${l.unit}`, fmtNum(l.counted), fmtNum(l.need)]) },
        { heading: 'Enough in the store', cols: ['Item', 'Have', 'Need'], right: [1, 2],
          rows: ok.map(l => [l.name, `${fmtNum(l.counted)} ${l.unit}`, `${fmtNum(l.need)} ${l.unit}`]) }] };
      // the admin has now seen the report, so the invoice step unlocks
      if (isAdmin && done && !check.reportSeenAt) {
        check.reportSeenAt = true;
        seen = updateDoc(doc(db, 'checks', block.start), { reportSeenAt: serverTimestamp() }).catch(console.error);
      }
    }

    if (v === 'missing') {
      const inv = check.invoice;
      $('#title').textContent = 'Still missing';
      $('#sub').textContent = `${label}. What did not arrive with the order. Buy these from local shops.`;
      const rows = lines.filter(l => l.buy > 0).map(l => {
        const got = Number(inv.received?.[l.id]) || 0;
        return { ...l, got, miss: toOrder(l.buy, got, l.unit) };
      });
      const miss = rows.filter(r => r.miss > 0), fine = rows.filter(r => !(r.miss > 0));
      stats([[miss.length, 'Missing'], [fine.length, 'Arrived'], [(inv.extra || []).length, 'Extra']]);
      $('#body').innerHTML = `
        <div class="lbl">Buy from local shops</div><div class="group plain" data-sq="22">${miss.map(r => `
          <div class="row"><div class="label">${esc(r.name)}<small>Ordered ${fmtNum(r.buy)} · arrived ${fmtNum(r.got)} ${esc(r.unit)}</small></div>
          <div class="amt">${amt(r.miss, r.unit)}</div></div>`).join('') || '<div class="empty">Nothing missing. The whole order arrived.</div>'}</div>
        <div class="lbl">Arrived in full</div><div class="group plain" data-sq="22">${fine.map(r => `
          <div class="row"><div class="label">${esc(r.name)}</div><div class="val">${fmtNum(r.got)} ${esc(r.unit)}</div></div>`).join('') || '<div class="empty">None.</div>'}</div>
        ${(inv.extra || []).length ? `<div class="lbl">On the invoice but not ordered</div><div class="group plain" data-sq="22">${inv.extra.map(x => `
          <div class="row"><div class="label">${esc(x.name)}</div><div class="val">${esc(x.qty ?? '')}</div></div>`).join('')}</div>` : ''}
        <p class="hint"><a class="link" href="invoice.html?block=${block.start}">See or change the invoice</a></p>`;
      pdfSpec = { name: 'Still missing', sections: [
        { heading: 'Buy from local shops', cols: ['Item', 'Buy', 'Ordered', 'Arrived'], right: [1, 2, 3],
          rows: miss.map(r => [r.name, `${fmtNum(r.miss)} ${r.unit}`, fmtNum(r.buy), fmtNum(r.got)]) }] };
    }

    $('#dl').hidden = !pdfSpec;
    refreshUI();
  }

  async function out(share) {
    $('#err').hidden = true;
    const btn = share ? $('#share') : $('#download'), was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Making PDF…';
    try {
      const blob = await makePdf({ title: `${pdfSpec.name} - ${blockLabel(block)}`, sub: `${label}. ${done ? 'Checked by ' + (check.checkedBy || '') : ''}`, sections: pdfSpec.sections });
      const text = pdfSpec.sections[0].rows.map(r => `${r[0]}: ${r[1]}`).join('\n');
      await shareOrDownload(blob, `${pdfSpec.name} ${block.start}.pdf`, `${pdfSpec.name} ${blockLabel(block)}\n\n${text}`, share);
    } catch (e) { console.error(e); $('#err').textContent = 'Could not make the PDF. Check your internet and try again.'; $('#err').hidden = false; }
    btn.disabled = false; btn.textContent = was;
  }
  $('#share').addEventListener('click', () => out(true));
  $('#download').addEventListener('click', () => out(false));

  // don't leave before "report seen" is saved, so Upload invoice shows on Today
  document.querySelector('.topbar a').addEventListener('click', async e => {
    const href = e.currentTarget.href;
    e.preventDefault(); await seen; location.href = href;
  });
  draw();
</script>
</body>
</html>
