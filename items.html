<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Items · Stock</title>
<link rel="stylesheet" href="apple-ui/apple-ui.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Stock">
<script src="js/theme.js"></script>
</head>
<body>

<div class="page wait">
  <div class="topbar">
    <span></span>
    <a class="icon-btn" aria-label="Add item" href="item.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </div>

  <h1 class="title">Items</h1>
  <p class="sub" id="count">Everything the restaurant keeps in stock, with its normal amount for each block.</p>

  <div class="group plain" data-sq="22" id="searchbox" hidden>
    <div class="row"><input class="field" id="search" type="search" placeholder="Search items"></div>
  </div>

  <div class="lbl">Normal amounts · Wed–Fri / Sat–Tue</div>
  <div class="group" data-sq="22" id="list"><div class="empty">Loading…</div></div>

  <div id="onlyBox" hidden>
    <div class="lbl">Only for festival groups</div>
    <div class="group" data-sq="22" id="only"></div>
    <p class="hint">These are added and changed inside their group.</p>
  </div>
</div>

<script src="js/shell.js" data-tab="items"></script>
<script src="apple-ui/apple-ui.js"></script>
<script type="module">
  import { start, $, esc, fmtNum, refreshUI, CHEV, fresh, loadStock } from './js/app.js';

  await start({ adminOnly: true });
  const ICON = '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8M12 12v8"/></svg></div>';
  let items = [];

  function draw() {
    const f = $('#search').value.trim().toLowerCase();
    const shown = items.filter(i => i.name.toLowerCase().includes(f));
    $('#list').innerHTML = !items.length
      ? '<div class="empty">No items yet. Tap + to add the first one.</div>'
      : !shown.length ? '<div class="empty">No item matches.</div>'
      : shown.map(i => `
        <a class="row" data-tap href="item.html?id=${encodeURIComponent(i.id)}" style="color:inherit;text-decoration:none">
          ${ICON}
          <div class="label">${esc(i.name)}</div>
          <div class="val">${fmtNum(i.wedFri)} / ${fmtNum(i.satTue)} ${esc(i.unit)}</div>${CHEV}
        </a>`).join('');
    refreshUI();
  }
  $('#search').addEventListener('input', draw);

  await fresh(loadStock, ({ items: all, groups }) => {
    items = all.filter(i => !i.onlyFor);
    const only = all.filter(i => i.onlyFor);
    $('#onlyBox').hidden = !only.length;
    $('#only').innerHTML = only.map(i => `
      <a class="row" data-tap href="group.html?id=${encodeURIComponent(i.onlyFor)}" style="color:inherit;text-decoration:none">
        ${ICON}<div class="label">${esc(i.name)}<small>${esc(groups[i.onlyFor]?.name || 'Deleted group')}</small></div>
        <div class="val">${esc(i.unit)}</div>${CHEV}
      </a>`).join('');
    $('#count').textContent = items.length
      ? `${items.length} item${items.length > 1 ? 's' : ''}. Tap one to change or delete it.`
      : 'Everything the restaurant keeps in stock, with its normal amount for each block.';
    $('#searchbox').hidden = items.length < 8;
    draw();
  });
</script>
</body>
</html>
