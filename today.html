<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today · Stock</title>
<link rel="stylesheet" href="apple-ui/apple-ui.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#f2f2f7">
<script src="js/theme.js"></script>
</head>
<body>

<div class="page wait">
  <h1 class="title" id="title">Today</h1>
  <p class="sub" id="date"></p>

  <div id="pushBox"></div>

  <!-- block summary, both roles -->
  <div class="group" data-sq="22">
    <div class="row">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
      <div class="label" id="blockName">…<small id="blockNote"></small></div>
    </div>
  </div>

  <!-- ===== checker ===== -->
  <div id="checker" hidden>
    <div id="cDone" hidden>
      <div class="lbl">Stock check</div>
      <div class="group" data-sq="22">
        <div class="row status"><span class="dot ok"></span><div class="label" id="cDoneText">Done<small></small></div></div>
        <a class="row" data-tap id="cSeeMine" style="color:inherit;text-decoration:none">
          <div class="label">See what was counted</div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
        </a>
      </div>
      <p class="hint" id="cNext"></p>
    </div>

    <div id="cTodo" hidden>
      <button class="btn" data-press id="cStart" style="margin-top:22px">Start counting</button>
      <div class="lbl" id="cProgress">Count what is in the store</div>
      <div class="group plain" data-sq="22" id="cList"><div class="empty">Loading…</div></div>
      <p class="hint">Tap any item to count or fix it. Your numbers are saved as you go.</p>
      <p class="error-text" id="cErr" hidden></p>
      <button class="btn frost" data-press id="cSubmit">Submit stock check</button>
    </div>
  </div>

  <!-- ===== admin ===== -->
  <div id="admin" hidden>
    <div class="lbl">Stock check</div>
    <div class="group" data-sq="22" id="aStatus"><div class="empty">Loading…</div></div>

    <div id="aActions"></div>

    <div id="aNotify" hidden>
      <div class="lbl">Remind a checker</div>
      <div class="group plain" data-sq="22" id="aCheckers"></div>
      <p class="error-text" id="aErr" hidden></p>
      <p class="ok-text" id="aOk" hidden></p>
      <button class="btn" data-press id="aSend">Send notification</button>
    </div>

    <div class="lbl">Past checks</div>
    <div class="group" data-sq="22" id="aPast"><div class="empty">Loading…</div></div>
  </div>
</div>

<script src="js/shell.js" data-tab="today"></script>
<script src="apple-ui/apple-ui.js"></script>
<script type="module">
  import { start, db, api, $, esc, fmtNum, isoDate, niceDate, shortDate, blockOf, nextBlock, blockLabel, BLOCK_NAME,
           refreshUI, byName, CHEV, fresh } from './js/app.js';
  import { blockData, festNote } from './js/check.js';
  import { countSheet } from './js/wheel.js';
  import { doc, setDoc, collection, getDocs, getDocsFromCache, query, where, orderBy, limit, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

  const { user, profile, isAdmin } = await start();
  const today = isoDate();
  const block = blockOf(today);
  const say = (el, t) => { $(el).textContent = t; $(el).hidden = !t; };
  const time = ts => ts?.toDate ? ts.toDate().toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const TICK = '<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';

  $('#date').textContent = niceDate(today, { weekday: 'long', day: 'numeric', month: 'long' });
  $('#blockName').firstChild.textContent = `${BLOCK_NAME[block.type]} block`;
  $('#blockNote').textContent = blockLabel(block);
  $('#checker').hidden = isAdmin; $('#admin').hidden = !isAdmin;
  if (!isAdmin) $('#title').textContent = 'Stock check';
  import('./js/push.js').then(m => m.offer($('#pushBox'))).catch(e => console.warn(e));

  let data = null;
  const counts = {};          // checker's numbers on this phone, kept across refreshes

  // draws the screen; runs twice: saved copy first, then the latest
  function render(d) {
    data = d;
    $('#blockNote').textContent = `${blockLabel(block)} · ` + (d.fest.length ? `${festNote(d.fest)}, amounts include the festival` : 'normal days');
    isAdmin ? drawAdmin() : drawChecker();
    refreshUI();
  }

  /* ================= checker ================= */
  function drawChecker() {
    const { check, lines } = data;
    const done = check?.status === 'submitted';
    $('#cDone').hidden = !done; $('#cTodo').hidden = done;
    if (done) {
      $('#cDoneText').innerHTML = `Done<small>Submitted by ${esc(check.checkedBy || '')} · ${esc(time(check.submittedAt))}</small>`;
      $('#cSeeMine').href = `check.html?block=${block.start}&v=inputs`;
      $('#cNext').textContent = `Next check: ${niceDate(nextBlock(block).start, { weekday: 'long', day: 'numeric', month: 'short' })}.`;
      return;
    }
    for (const l of lines) if (counts[l.id] == null && l.counted != null) counts[l.id] = l.counted;
    drawList();
  }
  function drawList() {
    const lines = data.lines;
    const n = lines.filter(l => counts[l.id] != null).length;
    $('#cProgress').textContent = `Counted ${n} of ${lines.length}`;
    $('#cStart').textContent = n === 0 ? 'Start counting' : n < lines.length ? 'Carry on counting' : 'Check the numbers again';
    $('#cStart').hidden = !lines.length;
    $('#cSubmit').hidden = !lines.length;
    $('#cSubmit').className = 'btn' + (n === lines.length ? '' : ' frost');
    $('#cList').innerHTML = lines.length ? lines.map((l, i) => `
      <div class="row" data-tap data-i="${i}" style="cursor:pointer">
        <div class="label">${esc(l.name)}</div>
        ${counts[l.id] != null
          ? `<div class="amt">${fmtNum(counts[l.id])}<span class="unit">${esc(l.unit)}</span></div>`
          : `<div class="todo">Tap to count</div>`}
      </div>`).join('') : '<div class="empty">No items to count yet. Ask the admin to add items.</div>';
    refreshUI();
  }

  // save each number as it is entered, so nothing is lost
  let saving = Promise.resolve();
  const saveCount = (l, v) => {
    counts[l.id] = v;
    drawList();
    say('#cErr', '');
    saving = saving.then(() => setDoc(doc(db, 'checks', block.start), {
      start: block.start, block: BLOCK_NAME[block.type], days: block.days, status: 'counting',
      items: { [l.id]: { name: l.name, unit: l.unit, counted: v } },
      checkedBy: profile.name || user.email, checkedByUid: user.uid, updatedAt: serverTimestamp(),
    }, { merge: true })).catch(e => { console.error(e); say('#cErr', 'Could not save. Check your internet.'); });
  };
  const openAt = i => countSheet({ lines: data.lines, index: i, values: counts, onSave: saveCount });
  $('#cList').addEventListener('click', e => { const r = e.target.closest('[data-i]'); if (r) openAt(+r.dataset.i); });
  $('#cStart').addEventListener('click', () => {
    const i = data.lines.findIndex(l => counts[l.id] == null);
    openAt(i < 0 ? 0 : i);
  });

  $('#cSubmit').addEventListener('click', async () => {
    const lines = data.lines;
    const missing = lines.filter(l => counts[l.id] == null);
    if (missing.length && !confirm(`${missing.length} item${missing.length > 1 ? 's are' : ' is'} not counted:\n${missing.slice(0, 8).map(l => l.name).join(', ')}${missing.length > 8 ? '…' : ''}\n\nCount ${missing.length > 1 ? 'them' : 'it'} as 0 and submit?`)) return;
    missing.forEach(l => counts[l.id] = 0);
    $('#cSubmit').disabled = true; $('#cSubmit').textContent = 'Submitting…';
    // freeze the amounts this check was made against
    const items = Object.fromEntries(lines.map(l => [l.id, { name: l.name, unit: l.unit, need: l.need, counted: counts[l.id] }]));
    try {
      await saving;
      await setDoc(doc(db, 'checks', block.start), {
        start: block.start, block: BLOCK_NAME[block.type], days: block.days, items, status: 'submitted',
        checkedBy: profile.name || user.email, checkedByUid: user.uid, submittedAt: serverTimestamp(),
      }, { merge: true });
      api('submitted', { block: block.start }).catch(e => console.warn('admin not told', e));
      render(await blockData(block));
    } catch (e) {
      console.error(e); say('#cErr', 'Could not submit. Check your internet and try again.');
    }
    $('#cSubmit').disabled = false; $('#cSubmit').textContent = 'Submit stock check';
  });

  /* ================= admin ================= */
  function drawAdmin() {
    const { check, lines } = data;
    const link = (v, label, primary) => `<a class="btn${primary ? '' : ' frost'}" data-press style="text-align:center;text-decoration:none"
        href="${v.includes('.html') ? v : `check.html?block=${block.start}&v=${v}`}">${label}</a>`;
    if (check?.status === 'submitted') {
      const toBuy = lines.filter(l => l.buy > 0).length;
      $('#aStatus').innerHTML = `
        <div class="row status"><span class="dot ok"></span>
          <div class="label">Checked<small>by ${esc(check.checkedBy || '')} · ${esc(time(check.submittedAt))}</small></div>
          <div class="val">${toBuy} to buy</div></div>`;
      let actions = link('inputs', 'See inputs', false) + link('report', 'Order report', !check.reportSeenAt);
      if (check.reportSeenAt) actions += link(`invoice.html?block=${block.start}`, check.invoice ? 'Invoice' : 'Upload invoice', !check.invoice);
      if (check.invoice) actions += link('missing', 'Still missing', true);
      $('#aActions').innerHTML = actions;
      $('#aNotify').hidden = true;
    } else {
      const n = lines.filter(l => l.counted != null).length;
      $('#aStatus').innerHTML = `
        <div class="row status"><span class="dot"></span>
          <div class="label">Not done yet<small>${n ? `${esc(check.checkedBy || 'A checker')} has counted ${n} of ${lines.length}` : 'Nobody has started counting'}</small></div></div>
        <a class="row" data-tap href="check.html?block=${block.start}&v=list" style="color:inherit;text-decoration:none">
          <div class="label">This block's list<small>${lines.length} items and how much of each is needed</small></div>${CHEV}</a>`;
      $('#aActions').innerHTML = '';
      $('#aNotify').hidden = false;
    }
  }

  // checkers to remind (admin)
  let people = [];
  function drawPeople(list) {
    const was = new Set([...document.querySelectorAll('#aCheckers .row:not(.sel)')].map(r => r.dataset.id));
    people = list;
    $('#aCheckers').innerHTML = people.length ? people.map(p => `
      <div class="row${was.has(p.id) ? '' : ' sel'}" data-tap data-id="${p.id}" style="cursor:pointer">${TICK}<div class="label">${esc(p.name)}</div></div>`).join('')
      : '<div class="empty">No checkers yet. Add them in Account → Checkers.</div>';
    $('#aSend').hidden = !people.length;
    refreshUI();
  }
  $('#aCheckers').addEventListener('click', e => e.target.closest('[data-id]')?.classList.toggle('sel'));
  $('#aSend').addEventListener('click', async () => {
    say('#aErr', ''); say('#aOk', '');
    const uids = [...document.querySelectorAll('#aCheckers .row.sel')].map(r => r.dataset.id);
    if (!uids.length) return say('#aErr', 'Tick at least one checker.');
    $('#aSend').disabled = true;
    try {
      const r = await api('notify', { uids, block: block.start });
      const names = people.filter(p => r.noPhone?.includes(p.id)).map(p => p.name);
      say('#aOk', (r.sent ? `Sent to ${r.sent} phone${r.sent > 1 ? 's' : ''}.` : 'Nothing was sent.') +
        (names.length ? ` ${names.join(', ')} ${names.length > 1 ? 'have' : 'has'} not turned on notifications yet.` : ''));
    } catch (e) {
      console.error(e);
      say('#aErr', e.status === 503 ? 'Notifications are not set up on the server yet.' : 'Could not send. Check your internet and try again.');
    }
    $('#aSend').disabled = false;
  });

  function drawPast(rows) {
    $('#aPast').innerHTML = rows.length ? rows.map(c => {
      const state = c.status !== 'submitted' ? 'Not submitted' : c.invoice ? 'Invoice checked' : 'Checked';
      return `<a class="row" data-tap href="check.html?block=${c.start}&v=${c.status === 'submitted' ? 'report' : 'inputs'}" style="color:inherit;text-decoration:none">
        <div class="label">${blockLabel(blockOf(c.start))}<small>${state}${c.checkedBy ? ' · ' + esc(c.checkedBy) : ''}</small></div>${CHEV}</a>`;
    }).join('') : '<div class="empty">No past checks yet.</div>';
    refreshUI();
  }

  /* ---------- load: saved copy first, then the latest ---------- */
  const jobs = [fresh(c => blockData(block, c), render)];
  if (isAdmin) {
    const usersQ = query(collection(db, 'users'), where('role', '==', 'checker'));
    const pastQ = query(collection(db, 'checks'), where('start', '<', block.start), orderBy('start', 'desc'), limit(8));
    const list = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
    jobs.push(fresh(async c => { const s = await (c ? getDocsFromCache : getDocs)(usersQ); return c && s.empty ? null : list(s).sort(byName); }, drawPeople));
    jobs.push(fresh(async c => { const s = await (c ? getDocsFromCache : getDocs)(pastQ); return c && s.empty ? null : list(s); }, drawPast));
  }
  await Promise.all(jobs.map(j => j.catch(e => console.error(e))));
</script>
</body>
</html>
